        <pre>
            A teacher has 23 candies to split evenly among 5 students.
            Write a function that returns how many candies each student gets, and how many are left over.
        </pre>
    </header>

    <script>


        document.getElementById("btn").addEventListener("click", function candyManager() {
            let candy = document.getElementById("inputcandy").value;
            let student = document.getElementById("inputstudent").value;
            let candyLeft = candy % student;
            let candyDistributed = candy - candyLeft;
            let eachStudentCandyCount = candyDistributed / student;
            document.getElementById("candy-distributed").textContent = eachStudentCandyCount;
            document.getElementById("candy-left").textContent = candyLeft;
        });

    </script>
