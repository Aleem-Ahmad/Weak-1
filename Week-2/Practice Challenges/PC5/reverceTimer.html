<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Counter</title>
    <link rel="stylesheet" href="">
</head>

<body>

    <header>
        <h2>Counter</h2>
        <h5>Tik Tik Tik ......</h5>
        <span id="counterTime"></span>

        <button id="p"> Play</button>
        <button id="s"> Pause</button>
        <button id="r"> Reset</button>

        <script>
            let time = 60;
            let tiktik;
            document.getElementById("p").addEventListener("click", () => {
                tiktik = setInterval(() => {
                    time--;
                    document.getElementById("counterTime").innerText = time;
                    if (time === 0) {
                        clearInterval(tiktik);
                    }
                }, 1000);
            });
        </script>
    </header>
</body>

</html>
