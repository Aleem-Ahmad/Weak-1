<!-- Show/hide password toggle
     A popup window made with plain JS -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Toggle</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           PAGE
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(135deg,
                    #f5f7fa,
                    #dfe9f3);

            color: #222;
        }


        /* =========================
           PASSWORD SECTION
        ========================= */

        #password-section {
            width: 100%;
            max-width: 450px;

            padding: 20px;
        }


        /* =========================
           FIELDSET
        ========================= */

        fieldset {
            border: none;
            border-radius: 18px;

            padding: 35px;

            background: white;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.12);
        }


        legend {
            padding: 0 12px;

            font-size: 24px;
            font-weight: 700;

            color: brown;
        }


        /* =========================
           LABEL
        ========================= */

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 15px;
            font-weight: 600;

            color: #444;
        }


        /* =========================
           PASSWORD INPUT
        ========================= */

        #password {
            width: 75%;
            height: 45px;

            padding: 0 14px;

            border: 2px solid #ddd;
            border-radius: 10px;

            outline: none;

            font-size: 16px;

            transition: 0.2s ease;
        }


        #password:focus {
            border-color: brown;

            box-shadow:
                0 0 0 3px rgba(165, 42, 42, 0.12);
        }


        /* =========================
           TOGGLE BUTTON
        ========================= */

        #toggle {
            width: 45px;
            height: 45px;

            margin-left: 5px;

            padding: 5px;

            border: none;
            border-radius: 10px;

            background-color: #f1f1f1;

            cursor: pointer;

            vertical-align: middle;

            transition: 0.2s ease;
        }


        #toggle:hover {
            background-color: #e2e2e2;

            transform: scale(1.05);
        }


        #toggle:active {
            transform: scale(0.95);
        }


        #toggle img {
            width: 30px;
            height: 30px;

            object-fit: contain;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        #login {
            display: block;

            width: 100%;
            height: 45px;

            margin-top: 25px;

            border: none;
            border-radius: 10px;

            background-color: brown;

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }


        #login:hover {
            background-color: #7d1f1f;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(165, 42, 42, 0.25);
        }


        #login:active {
            transform: translateY(0);
        }


        /* =========================
           POPUP
        ========================= */

        #popup {
            margin-top: 15px;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            background-color: #f5f5f5;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            fieldset {
                padding: 25px 20px;
            }

            #password {
                width: calc(100% - 55px);
            }

            legend {
                font-size: 21px;
            }
        }
    </style>
</head>


<body>

    <!-- Using semantic HTML -->

    <section id="password-section">

        <fieldset>

            <legend>Authentication</legend>

            <label for="password">
                Password
            </label>

            <input type="password" id="password" placeholder="Enter your password">

            <button id="toggle" type="button">
                <img id="toogle-img" src="/toogleicons/monkey.png" alt="Toggle password visibility">
            </button>

            <button id="login" type="button">
                Login
            </button>

            <div id="popup" style="display: none;">
                <span>LOGIN WILL WORK WHEN WE CONNECT DB AND A BACKEND,</span>
                <span>TILL THEN THE POPUP SHOW THIS</span>
            </div>

        </fieldset>

    </section>


    <script>

        let input = document.getElementById("password");
        let toggleBtn = document.getElementById("toggle");
        let loginBtn = document.getElementById("login");
        let popup = document.getElementById("popup");


        toggleBtn.addEventListener("click", () => {

            if (input.type === "password") {

                input.type = "text";

                toggleBtn.src =
                    "Week-2/Practice Challenges/PC#2&3/toogleicons/angry-monkey.png";

            }

            else {

                input.type = "password";

                toggleBtn.src =
                    "Week-2/Practice Challenges/PC#2&3/toogleicons/monkey.png";

            }

        });

        document.getElementById("login").addEventListener("click", () => {

            popup.style.display = "block";

            setTimeout(() => {
                popup.style.display = "none";
            }, 2000);

        });
    </script>

</body>

</html>
