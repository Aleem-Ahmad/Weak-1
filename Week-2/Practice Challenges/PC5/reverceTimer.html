<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Counter</title>
    <link rel="stylesheet" href="">
</head>

<body>

    <header>
        <h2>Counter</h2>
        <h5>Tik Tik Tik ......</h5>
        <span id="counterTime"></span>

        <button id="p"> Play</button>
        <button id="s"> Pause</button>
        <button id="r"> Reset</button>

        <script>
            let time = 3;
            let tiktik = null;

            let clock = document.getElementById("counterTime");
            let p = document.getElementById("p");
            let s = document.getElementById("s");
            let r = document.getElementById("r");

            tiktok = () => {
                tiktik = setInterval(() => {
                    time--;
                    clock.innerText = time;

                    if (time == 0) {
                        clearInterval(tiktik);
                        console.log("Timer stopped");
                    }
                }, 1000);
            }

            p.addEventListener("click", tiktok);

            stop = () => {
                clearInterval(tiktik);
                console.log("Timer stopped");
            }

            s.addEventListener("click", stop);

            let reset = () => {
                time = 0;
                clearInterval(tiktik);
                clock.innerText = time;
            }

            r.addEventListener("click", reset);





        </script>
    </header>
</body>

</html>
