<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse String Program</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        header,
        main,
        footer {
            width: 90%;
            margin: auto;
        }

        header {
            color: #8f0404;
            border-bottom: 2px solid;
            padding: 10px;
        }

        #input {
            margin-top: 30px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 30%;
        }

        #submit {
            margin-left: 20px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        #ReverseStr {
            margin-top: 20px;
        }

        #revStr {
            font-size: 24px;
            font-weight: bold;
            color: #8f0404;
        }
    </style>
</head>

<body>
    <header>
        <h2>Reverse String Program</h2>
        <pre>Reverse a string without using reverse()
</pre>
    </header>
    <main>
        <section id="inputSection">
            Enter Any String :
            <input id="input" type="text" placeholder="........" required>
            <button aria-label="Reverse the given string" id="submit" type="submit">
                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM4MzA3MDciIHN0cm9rZS13aWR0aD0iMyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBjbGFzcz0ibHVjaWRlIGx1Y2lkZS1tb3ZlLXJpZ2h0IHByZXZpZXctaWNvbiI+PHBhdGggZD0iTTE4IDhMMjIgMTJMMTggMTYiLz48cGF0aCBkPSJNMiAxMkgyMiIvPjwvc3ZnPg=="
                    alt="">
            </button>
        </section>

        <section id="ReverseStr">
            <p id="revStr"></p>
        </section>
    </main>

    <script>
        document.getElementById("submit").addEventListener("click", (e) => {
            e.preventDefault();
            let str = document.getElementById("input").value;
            let reverseStr = "";
            for (i = str.length - 1; i >= 0; i--) {
                reverseStr += str[i];
            }
            document.getElementById("revStr").innerText = `Reverse String : ${reverseStr}`;
        });
    </script>
</body>

</html>
